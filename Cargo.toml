[package]
name = "agentconductor"
version = "0.1.33"
default-run = "agentconductor"
edition = "2024"
license = "MIT"
description = "Local CLI subprocess orchestration with review-gated Git integration"

[features]
default = ["native-ui-probe"]
native-ui-probe = ["dep:eframe", "dep:image"]
test-fixtures = []

[[bin]]
name = "test_agent_fixture"
path = "tests/support/test_agent_fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "agentconductor-native-ui-probe"
path = "src/bin/native_ui_probe.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_probe"
path = "tests/native_ui_probe.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_launch"
path = "tests/native_ui_launch.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_bilingual"
path = "tests/native_ui_bilingual.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_room_render"
path = "tests/native_room_render.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_room_layout"
path = "tests/native_room_layout.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_room_stages"
path = "tests/native_room_stages.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_room_verification"
path = "tests/native_room_verification.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_room_review_summary"
path = "tests/native_room_review_summary.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_profiles"
path = "tests/native_ui_profiles.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_catalog"
path = "tests/native_ui_catalog.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_roles"
path = "tests/native_ui_roles.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_tasks"
path = "tests/native_ui_tasks.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_pending"
path = "tests/native_ui_pending.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_activity"
path = "tests/native_ui_activity.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_tool_dialog"
path = "tests/native_ui_tool_dialog.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_cache"
path = "tests/native_ui_cache.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_workspaces"
path = "tests/native_ui_workspaces.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_manual"
path = "tests/native_ui_manual.rs"
required-features = ["native-ui-probe"]

[[test]]
name = "native_ui_updates"
path = "tests/native_ui_updates.rs"
required-features = ["native-ui-probe"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time"] }
libc = "0.2"
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "system_fonts"] }
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg", "png"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["glow"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["wgpu"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
