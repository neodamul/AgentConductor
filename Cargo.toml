[package]
name = "agentconductor"
version = "0.1.0"
edition = "2024"
description = "Local CLI subprocess orchestration with review-gated Git integration"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time"] }
libc = "0.2"
