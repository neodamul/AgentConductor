[package]
name = "agentconductor"
version = "0.1.12"
edition = "2024"
license = "MIT"
description = "Local CLI subprocess orchestration with review-gated Git integration"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "time"] }
libc = "0.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
wry = { version = "0.57", default-features = false }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
