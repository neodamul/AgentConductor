name: Windows viewport acceptance

on:
  pull_request:
    paths:
      - "src/ui/native/webview2.rs"
      - "tests/windows_desktop.rs"
      - ".github/workflows/windows-viewport.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-viewport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resize:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
      - name: Build and drive the actual WebView2 desktop window
        run: cargo test --locked --test source_layout --test windows_desktop -- --nocapture
