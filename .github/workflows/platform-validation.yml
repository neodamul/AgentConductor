name: Platform validation

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", "licenses/**", ".gitattributes", "Cargo.toml", "Cargo.lock", "company-suffix.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Build the native packages too (a release packages in its own job).
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-viewport:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/windows-viewport.yml

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Tests alone take ~15 min on macOS; 20 cancelled green runs during the lint step (#470).
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      # R-70: UTF-8 on every runner (Windows defaults to cp1252).
      PYTHONUTF8: "1"
    steps:
      - name: Checkout committed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
        with:
          persist-credentials: false
      - name: Record native toolchain
        run: |
          rustc --version
          cargo --version
          git --version
      - name: Build native target and tests
        run: cargo build --all-targets --locked
      - name: Enforce source and test layout
        run: cargo test --locked --test source_layout
      - name: Execute applicable native tests
        env:
          PARITY_OUT: ${{ runner.temp }}/parity-captures
        run: cargo test --all-targets --locked --no-fail-fast
      - name: Retain design parity captures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: parity-captures-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/parity-captures
          if-no-files-found: warn
      - name: Validate opt-in native Rust UI launch path
        run: |
          cargo test --locked --features native-ui-probe --test native_ui_launch --test native_ui_probe --test native_room_render --test native_ui_profiles --test native_ui_roles --test native_ui_tasks --test native_ui_pending --test native_ui_activity --test native_ui_tool_dialog --test native_ui_cache --test native_ui_workspaces
          cargo check --locked --bin agentconductor --features native-ui-probe
          cargo check --locked --bin agentconductor-native-ui-probe --features native-ui-probe
          cargo clippy --locked --bin agentconductor --bin agentconductor-native-ui-probe --test native_ui_launch --test native_ui_probe --test native_room_render --test native_ui_profiles --test native_ui_roles --test native_ui_tasks --test native_ui_pending --test native_ui_activity --test native_ui_tool_dialog --test native_ui_cache --test native_ui_workspaces --features native-ui-probe -- -D warnings
      - name: Verify packaging and embedded UI contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check lint warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Require a safety comment on every unsafe block
        run: cargo clippy --lib --bins --tests --locked --features native-ui-probe -- -D clippy::undocumented_unsafe_blocks

  # GitHub #876: packaging needs no test result, so it runs beside validation; a release skips it here and packages itself.
  native-package:
    if: inputs.package != false
    uses: ./.github/workflows/native-package.yml
