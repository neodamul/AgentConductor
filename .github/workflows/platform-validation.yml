name: Platform validation

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout committed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
        with:
          persist-credentials: false
      - name: Record native toolchain
        run: |
          rustc --version
          cargo --version
          git --version
      - name: Build native target and tests
        run: cargo build --all-targets --locked
      - name: Execute applicable native tests
        run: cargo test --all-targets --locked
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check lint warnings
        run: cargo clippy --all-targets --locked -- -D warnings
