name: Platform validation

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", "licenses/**", ".gitattributes", "Cargo.toml", "Cargo.lock", "company-suffix.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout committed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
        with:
          persist-credentials: false
      - name: Record native toolchain
        run: |
          rustc --version
          cargo --version
          git --version
      - name: Build native target and tests
        run: cargo build --all-targets --locked --features test-fixtures
      - name: Enforce source and test layout
        run: cargo test --locked --test source_layout
      - name: Execute applicable native tests
        run: cargo test --all-targets --locked --features test-fixtures --no-fail-fast
      - name: Validate opt-in native Rust UI launch path
        run: |
          cargo test --locked --features native-ui-probe --test native_ui_launch --test native_ui_probe --test native_room_render --test native_room_next_step --test native_room_briefing_layout --test native_ui_profiles --test native_ui_profile_rules_layout --test native_ui_roles --test native_ui_tasks --test native_ui_pending --test native_ui_activity --test native_ui_room_language --test native_ui_profile_quota_editor --test native_plan_task_cards --test native_ui_tool_dialog --test native_ui_cache --test native_ui_workspaces --test native_ui_workspace_menu_layout --test native_ui_goal_menu_layout --test native_workspace_goal_analysis_layout --test native_workspace_phase_popup_layout --test native_workspace_phase_progress --test native_ui_plan_layout --test native_ui_mcp_source_layout --test native_ui_navigation_overlays --test native_ui_execution_language --test native_ui_updates --test native_ui_manual --test native_ui_appearance --test native_scope_recovery --test native_scope_recovery_actions
          cargo check --locked --bin agentconductor --features native-ui-probe
          cargo check --locked --bin agentconductor-native-ui-probe --features native-ui-probe
          cargo clippy --locked --bin agentconductor --bin agentconductor-native-ui-probe --test native_ui_launch --test native_ui_probe --test native_room_render --test native_room_next_step --test native_room_briefing_layout --test native_ui_profiles --test native_ui_profile_rules_layout --test native_ui_roles --test native_ui_tasks --test native_ui_pending --test native_ui_activity --test native_ui_room_language --test native_ui_profile_quota_editor --test native_plan_task_cards --test native_ui_tool_dialog --test native_ui_cache --test native_ui_workspaces --test native_ui_workspace_menu_layout --test native_ui_goal_menu_layout --test native_workspace_goal_analysis_layout --test native_workspace_phase_popup_layout --test native_workspace_phase_progress --test native_ui_plan_layout --test native_ui_mcp_source_layout --test native_ui_navigation_overlays --test native_ui_execution_language --test native_ui_updates --test native_ui_manual --test native_ui_appearance --test native_scope_recovery --test native_scope_recovery_actions --features native-ui-probe -- -D warnings
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check lint warnings
        run: cargo clippy --all-targets --locked --features test-fixtures -- -D warnings
      - name: Require a safety comment on every unsafe block
        run: cargo clippy --lib --bins --locked --features native-ui-probe -- -D clippy::undocumented_unsafe_blocks

  native-package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, MIT
        with:
          persist-credentials: false
      - name: Build native release executable
        run: cargo build --release --locked
      - name: Render bilingual manuals with the Rust binary
        run: cargo run --release --locked -- manual render
      - name: Package and execute the exact release binary
        run: cargo run --release --locked -- package-release
      - name: Verify the packaged Windows default desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/agentconductor-x86_64-pc-windows-msvc-$($env:GITHUB_SHA.Substring(0, 12))/agentconductor.exe"
          $env:AGENTCONDUCTOR_DESKTOP_BINARY = (Resolve-Path $package).Path
          cargo test --locked --test windows_desktop -- --nocapture
      - name: Retain verified package and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, MIT
        with:
          name: native-package-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/ARCHIVE-SHA256SUMS
            .agentconductor/verification/packaged-workflow/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
