<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc"><title id="title">AgentConductor terminal console concept</title><desc id="desc">Illustrative terminal interface with editable goal, optional worktrees, selected task feedback, pause and resume, diff inspection, and approve, reject, revise controls. Not an implemented UI.</desc><rect width="1280" height="940" fill="#11171c"/><g font-family="Menlo, Consolas, monospace"><rect x="0" y="0" width="1280" height="56" fill="#1d2b31"/><text x="24" y="35" fill="#8ce6c9" font-size="23" font-weight="bold">&gt;_ AgentConductor</text><text x="430" y="34" fill="#8da3ac" font-size="14" font-weight="normal">auth-service / local</text><text x="997" y="34" fill="#e8bd79" font-size="14" font-weight="normal">CONSOLE DESIGN MOCKUP</text><text x="24" y="86" fill="#8da3ac" font-size="13" font-weight="normal">GOAL</text><text x="1030" y="86" fill="#8ce6c9" font-size="14" font-weight="normal">[e] Edit goal</text><rect x="24" y="100" width="1232" height="47" fill="#162229" stroke="#34434b"/><text x="40" y="130" fill="#e1ebee" font-size="16" font-weight="normal">&gt; Add refresh token rotation, edge case tests, and API documentation</text><text x="24" y="178" fill="#8da3ac" font-size="14" font-weight="normal">Workspace:</text><text x="140" y="178" fill="#8ce6c9" font-size="14" font-weight="normal">(●) shared   ( ) worktree</text><text x="535" y="178" fill="#8ce6c9" font-size="13" font-weight="normal">[w] Change mode</text><text x="902" y="178" fill="#8da3ac" font-size="14" font-weight="normal">2 running / limit 3</text><path d="M24 199 H1256" stroke="#34434b"/><text x="24" y="228" fill="#e1ebee" font-size="15" font-weight="bold">TASKS</text><text x="770" y="228" fill="#8da3ac" font-size="13" font-weight="normal">[↑↓] Select  [Enter] Inspect  [p] Pause</text><text x="50" y="263" fill="#8da3ac" font-size="13" font-weight="normal">TASK / AGENT</text><text x="442" y="263" fill="#8da3ac" font-size="13" font-weight="normal">STATE</text><text x="610" y="263" fill="#8da3ac" font-size="13" font-weight="normal">OWNED PATH</text><text x="890" y="263" fill="#8da3ac" font-size="13" font-weight="normal">LATEST REPORT</text><rect x="24" y="278" width="1232" height="46" fill="#213b40"/><text x="36" y="307" fill="#a4f0d5" font-size="16" font-weight="bold">› 01  Claude Code</text><text x="442" y="307" fill="#8ce6c9" font-size="15" font-weight="normal">running</text><text x="610" y="307" fill="#c4d0d5" font-size="15" font-weight="normal">src/auth/</text><text x="890" y="307" fill="#c4d0d5" font-size="14" font-weight="normal">Checking token family</text><text x="50" y="354" fill="#c4d0d5" font-size="16" font-weight="normal">02  Codex</text><text x="442" y="354" fill="#8ce6c9" font-size="15" font-weight="normal">running</text><text x="610" y="354" fill="#c4d0d5" font-size="15" font-weight="normal">tests/auth/</text><text x="890" y="354" fill="#c4d0d5" font-size="14" font-weight="normal">Writing reuse test</text><text x="50" y="401" fill="#c4d0d5" font-size="16" font-weight="normal">03  OpenCode</text><text x="442" y="401" fill="#8da3ac" font-size="15" font-weight="normal">completed</text><text x="610" y="401" fill="#c4d0d5" font-size="15" font-weight="normal">docs/api/</text><text x="890" y="401" fill="#c4d0d5" font-size="14" font-weight="normal">3 files ready</text><path d="M24 423 H1256" stroke="#34434b"/><text x="24" y="452" fill="#a4f0d5" font-size="14" font-weight="normal">SELECTED: 01 / Claude Code</text><rect x="497" y="433" width="130" height="30" fill="#1b292e" stroke="#3a565f"/><text x="507" y="453" fill="#73dfbd" font-size="13" font-weight="normal">[p] Pause</text><rect x="637" y="433" width="140" height="30" fill="#1b292e" stroke="#3a565f"/><text x="647" y="453" fill="#73dfbd" font-size="13" font-weight="normal">[r] Resume</text><rect x="787" y="433" width="154" height="30" fill="#1b292e" stroke="#3a565f"/><text x="797" y="453" fill="#73dfbd" font-size="13" font-weight="normal">[f] Feedback</text><rect x="951" y="433" width="154" height="30" fill="#1b292e" stroke="#3a565f"/><text x="961" y="453" fill="#efb4a1" font-size="13" font-weight="normal">[x] Stop</text><text x="24" y="491" fill="#e1ebee" font-size="14" font-weight="bold">DIFF  src/auth/refresh.rs</text><text x="678" y="491" fill="#e1ebee" font-size="14" font-weight="bold">ACTIVITY  [l] Full logs</text><rect x="24" y="506" width="624" height="168" fill="#141e24" stroke="#34434b"/><rect x="668" y="506" width="588" height="168" fill="#141e24" stroke="#34434b"/><text x="40" y="536" fill="#8da3ac" font-size="14" font-weight="normal">@@ refresh_token()</text><rect x="38" y="551" width="594" height="30" fill="#36252c"/><text x="48" y="572" fill="#efb4b4" font-size="14" font-weight="normal">- issue_refresh_token(user_id)</text><rect x="38" y="584" width="594" height="61" fill="#1d3430"/><text x="48" y="606" fill="#9be4bd" font-size="14" font-weight="normal">+ revoke_previous_token(token_id)?;</text><text x="48" y="633" fill="#9be4bd" font-size="14" font-weight="normal">+ issue_rotated_token(user_id, family_id)</text><text x="685" y="536" fill="#8da3ac" font-size="13" font-weight="normal">10:42:01 claude   session started</text><text x="685" y="563" fill="#c4d0d5" font-size="13" font-weight="normal">10:42:03 codex    writing test fixtures</text><text x="685" y="590" fill="#c4d0d5" font-size="13" font-weight="normal">10:42:12 opencode result collected</text><text x="685" y="617" fill="#9be4bd" font-size="13" font-weight="normal">10:42:13 scope    docs verified</text><text x="685" y="652" fill="#8da3ac" font-size="12" font-weight="normal">Raw stdout and stderr stored locally</text><text x="24" y="706" fill="#e1ebee" font-size="14" font-weight="bold">FEEDBACK TO SELECTED TASK</text><text x="794" y="706" fill="#8ce6c9" font-size="13" font-weight="normal">[Ctrl+Enter] Queue revision</text><rect x="24" y="720" width="1232" height="46" fill="#162229" stroke="#557c84"/><text x="40" y="749" fill="#e1ebee" font-size="15" font-weight="normal">&gt; Add a reuse-detection test before finalizing the rotation logic. ▌</text><text x="24" y="794" fill="#e8bd79" font-size="14" font-weight="bold">APPROVAL QUEUE</text><text x="270" y="794" fill="#c4d0d5" font-size="14" font-weight="normal">Example candidate / 28 tests passed / pinned SHA</text><rect x="24" y="813" width="175" height="30" fill="#1b292e" stroke="#3a565f"/><text x="34" y="833" fill="#73dfbd" font-size="13" font-weight="normal">[d] Inspect diff</text><rect x="211" y="813" width="166" height="30" fill="#1b292e" stroke="#3a565f"/><text x="221" y="833" fill="#a4f0d5" font-size="13" font-weight="normal">[a] Approve</text><rect x="389" y="813" width="155" height="30" fill="#1b292e" stroke="#3a565f"/><text x="399" y="833" fill="#efb4a1" font-size="13" font-weight="normal">[n] Reject</text><rect x="556" y="813" width="200" height="30" fill="#1b292e" stroke="#3a565f"/><text x="566" y="833" fill="#e8bd79" font-size="13" font-weight="normal">[v] Request revision</text><text x="789" y="834" fill="#8da3ac" font-size="12" font-weight="normal">Only the reviewed SHA can merge.</text><path d="M24 861 H1256" stroke="#34434b"/><text x="24" y="889" fill="#8da3ac" font-size="13" font-weight="normal">[?] Help    [Tab] Focus    [Esc] Cancel    [q] Exit</text><text x="24" y="919" fill="#8da3ac" font-size="12" font-weight="normal">ILLUSTRATIVE DATA / Planned controls; this is not a working TUI or measured test output.</text></g></svg>