<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title"><title id="title">B / Dispatch desk — illustrative design mockup</title><rect width="1280" height="860" fill="#eceee9"/><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="62" rx="0" fill="#23352f"/><text x="24" y="39" font-size="22" fill="#f3f5ed" font-weight="700">AgentConductor</text><text x="995" y="38" font-size="13" fill="#c3deb5" font-weight="700">B · DISPATCH DESK</text><text x="28" y="108" font-size="25" fill="#23352f" font-weight="700">One goal. Three assignments. Your checkpoints.</text><rect x="28" y="132" width="1224" height="57" rx="6" fill="#fbfcf7" stroke="#c8cfc2"/><text x="45" y="168" font-size="17" fill="#23352f" font-family="Menlo, Consolas, monospace">&gt; Add refresh token rotation, tests, and API documentation</text><text x="28" y="221" font-size="13" fill="#23352f">Workspace  ● Shared  ○ Worktrees     [change]</text><text x="860" y="221" font-size="13" fill="#68766c">Concurrency  3 max     [configure]</text><rect x="28" y="251" width="276" height="52" rx="4" fill="#dfe4d8"/><text x="44" y="283" font-size="17" fill="#23352f" font-weight="700">01  Plan</text><rect x="344" y="251" width="276" height="52" rx="4" fill="#23352f"/><text x="360" y="283" font-size="17" fill="#f4f7ed" font-weight="700">02  Tasks</text><rect x="660" y="251" width="276" height="52" rx="4" fill="#dfe4d8"/><text x="676" y="283" font-size="17" fill="#23352f" font-weight="700">03  Verify</text><rect x="976" y="251" width="276" height="52" rx="4" fill="#dfe4d8"/><text x="992" y="283" font-size="17" fill="#23352f" font-weight="700">04  Complete</text><text x="28" y="340" font-size="12" fill="#68766c" font-weight="700">ASSIGNMENTS</text><text x="804" y="340" font-size="13" fill="#68766c">Select a task to edit scope, agent, or feedback.</text><rect x="28" y="359" width="1224" height="63" rx="4" fill="#fbfcf7" stroke="#c8cfc2"/><text x="45" y="396" font-size="16" fill="#68766c" font-family="Menlo, Consolas, monospace">01</text><text x="110" y="396" font-size="17" fill="#23352f" font-weight="700">Claude Code</text><text x="320" y="396" font-size="16" fill="#23352f">Implement rotation</text><text x="672" y="395" font-size="12" fill="#476646" font-weight="700">RUNNING</text><rect x="875" y="374" width="150" height="32" rx="3" fill="#e4e9dd"/><text x="889" y="395" font-size="13" fill="#23352f">Edit assignment</text><rect x="1041" y="374" width="187" height="32" rx="3" fill="#23352f"/><text x="1055" y="395" font-size="13" fill="#eff5e7">Pause / Resume</text><rect x="28" y="433" width="1224" height="63" rx="4" fill="#fbfcf7" stroke="#c8cfc2"/><text x="45" y="470" font-size="16" fill="#68766c" font-family="Menlo, Consolas, monospace">02</text><text x="110" y="470" font-size="17" fill="#23352f" font-weight="700">Codex</text><text x="320" y="470" font-size="16" fill="#23352f">Write edge case tests</text><text x="672" y="469" font-size="12" fill="#476646" font-weight="700">RUNNING</text><rect x="875" y="448" width="150" height="32" rx="3" fill="#e4e9dd"/><text x="889" y="469" font-size="13" fill="#23352f">Edit assignment</text><rect x="1041" y="448" width="187" height="32" rx="3" fill="#23352f"/><text x="1055" y="469" font-size="13" fill="#eff5e7">Pause / Resume</text><rect x="28" y="507" width="1224" height="63" rx="4" fill="#fbfcf7" stroke="#c8cfc2"/><text x="45" y="544" font-size="16" fill="#68766c" font-family="Menlo, Consolas, monospace">03</text><text x="110" y="544" font-size="17" fill="#23352f" font-weight="700">OpenCode</text><text x="320" y="544" font-size="16" fill="#23352f">Update API documentation</text><text x="672" y="543" font-size="12" fill="#476646" font-weight="700">COMPLETED</text><rect x="875" y="522" width="150" height="32" rx="3" fill="#e4e9dd"/><text x="889" y="543" font-size="13" fill="#23352f">Edit assignment</text><rect x="1041" y="522" width="187" height="32" rx="3" fill="#23352f"/><text x="1055" y="543" font-size="13" fill="#eff5e7">Pause / Resume</text><text x="28" y="611" font-size="12" fill="#68766c" font-weight="700">YOUR NEXT DECISION</text><rect x="28" y="626" width="680" height="164" rx="6" fill="#fbfcf7" stroke="#c8cfc2"/><text x="46" y="654" font-size="17" fill="#23352f" font-weight="700">Revise selected task / Claude Code</text><text x="46" y="685" font-size="15" fill="#23352f">Add a reuse-detection test before review.</text><rect x="46" y="705" width="643" height="1" rx="0" fill="#c8cfc2"/><text x="46" y="738" font-size="13" fill="#68766c">[Attach evidence]   [Cancel]</text><rect x="516" y="726" width="171" height="40" rx="4" fill="#23352f"/><text x="532" y="752" font-size="14" fill="#eff5e7" font-weight="700">Send instruction</text><rect x="730" y="626" width="522" height="164" rx="6" fill="#dce8d2"/><text x="750" y="655" font-size="17" fill="#23352f" font-weight="700">Review gate / 1 waiting</text><text x="750" y="686" font-size="13" fill="#23352f">Example: 28 passing tests · candidate pinned</text><text x="750" y="716" font-size="13" fill="#23352f">[Inspect diff]  [Request revision]</text><text x="750" y="756" font-size="14" fill="#36552e" font-weight="700">[Approve candidate]     [Reject]</text><rect x="20" y="828" width="1240" height="1" rx="0" fill="#2b3341"/><text x="24" y="849" font-size="12" fill="#68766c">DESIGN MOCKUP · All tasks, activity, and test results are illustrative. Controls are not implemented.</text></g></svg>