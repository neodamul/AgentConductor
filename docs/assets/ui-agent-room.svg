<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title"><title id="title">A / Agent room — illustrative design mockup</title><rect width="1280" height="860" fill="#eceee9" /><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="58" rx="0" fill="#23352f" /><text x="24" y="37" font-size="22" fill="#f3f5ed" font-weight="700">AgentConductor</text><text x="255" y="35" font-size="14" fill="#f3f5ed">/ auth-service</text><text x="1065" y="35" font-size="13" fill="#c3deb5" font-weight="700">A · AGENT ROOM</text><rect x="0" y="58" width="235" height="770" rx="0" fill="#e4e8df" /><text x="22" y="94" font-size="11" fill="#68766c" font-weight="700">WORKSPACE</text><text x="22" y="125" font-size="15" fill="#23352f">Shared directory</text><text x="22" y="151" font-size="12" fill="#476646">Worktrees: off   [change]</text><text x="22" y="196" font-size="11" fill="#68766c" font-weight="700">YOUR TEAM</text><rect x="12" y="214" width="211" height="72" rx="8" fill="#d4e2c9" /><text x="26" y="241" font-size="16" fill="#476646" font-weight="700">Claude Code</text><text x="26" y="266" font-size="12" fill="#68766c">Running · implementation</text><text x="26" y="326" font-size="16" fill="#23352f" font-weight="700">Codex</text><text x="26" y="351" font-size="12" fill="#68766c">Running · tests</text><text x="26" y="411" font-size="16" fill="#23352f" font-weight="700">OpenCode</text><text x="26" y="436" font-size="12" fill="#68766c">Completed · docs</text><text x="22" y="503" font-size="11" fill="#68766c" font-weight="700">APPROVALS</text><text x="22" y="537" font-size="14" fill="#84602a">1 candidate waiting</text><text x="22" y="570" font-size="13" fill="#476646">Open review →</text><rect x="22" y="603" width="190" height="1" rx="0" fill="#c8cfc2" /><text x="22" y="634" font-size="12" fill="#68766c">[Space] Pause selected</text><text x="22" y="662" font-size="12" fill="#68766c">[R] Resume  [X] Stop</text><text x="22" y="798" font-size="12" fill="#68766c">Local · no API key setup</text><text x="259" y="99" font-size="23" fill="#23352f" font-weight="700">Refresh token rotation</text><text x="259" y="126" font-size="13" fill="#68766c">Goal and scope are editable before dispatch.</text><rect x="775" y="83" width="116" height="34" rx="6" fill="#dfe6d8" /><text x="787" y="105" font-size="13" fill="#23352f" font-weight="700">Edit goal</text><rect x="259" y="149" width="637" height="1" rx="0" fill="#c8cfc2" /><text x="259" y="181" font-size="16" fill="#476646" font-weight="700">Claude Code</text><text x="386" y="181" font-size="13" fill="#68766c">Selected task / src/auth/</text><rect x="259" y="199" width="637" height="89" rx="8" fill="#fbfcf7" /><text x="277" y="228" font-size="12" fill="#68766c" font-weight="700">Progress report</text><text x="277" y="254" font-size="15" fill="#23352f">Rotation is implemented. I am checking reuse detection.</text><text x="277" y="276" font-size="12" fill="#68766c">Evidence: src/auth/refresh.rs · 4 files changed</text><text x="259" y="329" font-size="16" fill="#23352f" font-weight="700">You</text><text x="303" y="329" font-size="12" fill="#68766c">10:42</text><text x="259" y="358" font-size="15" fill="#23352f">Please preserve token-family revocation on reuse.</text><text x="259" y="405" font-size="16" fill="#476646" font-weight="700">Claude Code</text><text x="259" y="435" font-size="15" fill="#23352f">I will add a regression case before requesting review.</text><rect x="259" y="461" width="637" height="1" rx="0" fill="#c8cfc2" /><text x="259" y="494" font-size="12" fill="#68766c" font-weight="700">Latest activity</text><text x="259" y="522" font-size="13" fill="#68766c" font-family="Menlo, Consolas, monospace">10:42:03  Reading refresh.rs</text><text x="259" y="550" font-size="13" fill="#68766c" font-family="Menlo, Consolas, monospace">10:42:09  Updating reuse-detection branch</text><text x="259" y="578" font-size="13" fill="#68766c" font-family="Menlo, Consolas, monospace">10:42:12  Diff captured locally</text><rect x="259" y="632" width="637" height="104" rx="8" fill="#fbfcf7" stroke="#a6b49f" /><text x="277" y="660" font-size="14" fill="#68766c">Message Claude Code…</text><text x="277" y="694" font-size="14" fill="#23352f">Add a regression test for repeated refresh-token use.</text><text x="277" y="720" font-size="12" fill="#68766c">Attach: diff / test evidence     Ctrl+Enter to send</text><rect x="259" y="752" width="100" height="34" rx="6" fill="#dfe6d8" /><text x="271" y="774" font-size="13" fill="#23352f" font-weight="700">Pause</text><rect x="370" y="752" width="100" height="34" rx="6" fill="#dfe6d8" /><text x="382" y="774" font-size="13" fill="#23352f" font-weight="700">Resume</text><rect x="481" y="752" width="155" height="34" rx="6" fill="#dfe6d8" /><text x="493" y="774" font-size="13" fill="#23352f" font-weight="700">Request revision</text><rect x="762" y="752" width="134" height="34" rx="6" fill="#476646" /><text x="774" y="774" font-size="13" fill="#f2f5ec" font-weight="700">Send feedback</text><rect x="920" y="58" width="360" height="770" rx="0" fill="#e4e8df" /><text x="944" y="100" font-size="17" fill="#23352f" font-weight="700">Task inspector</text><text x="944" y="141" font-size="11" fill="#68766c" font-weight="700">OWNERSHIP</text><text x="944" y="171" font-size="14" fill="#23352f" font-family="Menlo, Consolas, monospace">src/auth/</text><text x="944" y="210" font-size="11" fill="#68766c" font-weight="700">COMPLETION CHECKS</text><text x="944" y="240" font-size="14" fill="#36552e">✓ Token rotation implemented</text><text x="944" y="271" font-size="14" fill="#23352f">○ Reuse regression test</text><text x="944" y="302" font-size="14" fill="#23352f">○ Final integration verification</text><rect x="944" y="329" width="310" height="1" rx="0" fill="#c8cfc2" /><text x="944" y="365" font-size="17" fill="#23352f" font-weight="700">Review candidate</text><text x="944" y="397" font-size="14" fill="#36552e">Example: 28 tests passed</text><text x="944" y="427" font-size="12" fill="#68766c">SHA 4f91a2b · inspect before approval</text><rect x="944" y="452" width="150" height="34" rx="6" fill="#dfe6d8" /><text x="956" y="474" font-size="13" fill="#23352f" font-weight="700">Inspect diff</text><rect x="944" y="503" width="145" height="34" rx="6" fill="#476646" /><text x="956" y="525" font-size="13" fill="#f2f5ec" font-weight="700">Approve</text><rect x="1100" y="503" width="145" height="34" rx="6" fill="#dfe6d8" /><text x="1112" y="525" font-size="13" fill="#23352f" font-weight="700">Reject</text><rect x="944" y="550" width="301" height="34" rx="6" fill="#dfe6d8" /><text x="956" y="572" font-size="13" fill="#23352f" font-weight="700">Request revision</text><text x="944" y="621" font-size="12" fill="#68766c">Approvals bind to the reviewed SHA.</text><text x="944" y="646" font-size="12" fill="#68766c">Edits invalidate previous approval.</text><rect x="20" y="828" width="1240" height="1" rx="0" fill="#c8cfc2" /><text x="24" y="849" font-size="12" fill="#68766c">DESIGN MOCKUP · All tasks, activity, and test results are illustrative. Controls are not implemented.</text></g></svg>