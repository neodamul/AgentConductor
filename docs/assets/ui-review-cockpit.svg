<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title"><title id="title">C / Review cockpit — illustrative design mockup</title><rect width="1280" height="860" fill="#13181f"/><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="58" rx="0" fill="#202a38"/><text x="22" y="36" font-size="22" fill="#dce3ee" font-weight="700">AgentConductor</text><text x="273" y="35" font-size="14" fill="#8e9aaf">/ review candidate</text><text x="1030" y="35" font-size="13" fill="#8bb9ff" font-weight="700">C · REVIEW COCKPIT</text><text x="22" y="90" font-size="17" fill="#dce3ee" font-weight="700">Goal: refresh token rotation</text><text x="631" y="90" font-size="13" fill="#8e9aaf">Shared workspace · worktrees optional</text><text x="1035" y="90" font-size="13" fill="#efc084">3 agents / 1 gate</text><rect x="22" y="111" width="1236" height="1" rx="0" fill="#2b3341"/><rect x="22" y="129" width="225" height="554" rx="6" fill="#1a212d"/><text x="38" y="158" font-size="12" fill="#8e9aaf" font-weight="700">CHANGED FILES</text><rect x="30" y="173" width="209" height="34" rx="4" fill="#273a56"/><text x="38" y="196" font-size="13" fill="#8bb9ff" font-family="Menlo, Consolas, monospace">src/auth/refresh.rs</text><text x="38" y="235" font-size="13" fill="#dce3ee" font-family="Menlo, Consolas, monospace">src/auth/token.rs</text><text x="38" y="274" font-size="13" fill="#dce3ee" font-family="Menlo, Consolas, monospace">tests/auth/reuse.rs</text><text x="38" y="313" font-size="13" fill="#dce3ee" font-family="Menlo, Consolas, monospace">docs/api/auth.md</text><rect x="38" y="344" width="189" height="1" rx="0" fill="#2b3341"/><text x="38" y="374" font-size="12" fill="#8e9aaf" font-weight="700">EVIDENCE</text><text x="38" y="407" font-size="14" fill="#9bdab7">✓ 28 tests passed</text><text x="38" y="439" font-size="14" fill="#9bdab7">✓ Scope checked</text><text x="38" y="471" font-size="14" fill="#efc084">○ Your approval</text><text x="38" y="534" font-size="12" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">Base: 08ae7c1</text><text x="38" y="562" font-size="12" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">Head: 4f91a2b</text><text x="38" y="622" font-size="13" fill="#8bb9ff">[t] Test output</text><text x="38" y="651" font-size="13" fill="#8bb9ff">[l] Agent logs</text><text x="269" y="157" font-size="16" fill="#dce3ee" font-weight="700">refresh.rs</text><text x="583" y="157" font-size="13" fill="#8bb9ff">[Unified]  [Split]  [Comment]</text><rect x="269" y="177" width="671" height="506" rx="6" fill="#161f2b" stroke="#2d3b4f"/><text x="289" y="211" font-size="14" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">  40  fn refresh_token(</text><text x="289" y="243" font-size="14" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">  41      token: RefreshToken,</text><text x="289" y="275" font-size="14" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">  42  ) -&gt; Result&lt;TokenPair&gt; {</text><rect x="281" y="286" width="647" height="29" rx="0" fill="#372a34"/><text x="289" y="307" font-size="14" fill="#efb4b4" font-family="Menlo, Consolas, monospace">- 43      issue_refresh_token(user_id)</text><rect x="281" y="318" width="647" height="29" rx="0" fill="#1c3633"/><text x="289" y="339" font-size="14" fill="#9bdab7" font-family="Menlo, Consolas, monospace">+ 43      revoke_previous_token(token.id)?;</text><rect x="281" y="350" width="647" height="29" rx="0" fill="#1c3633"/><text x="289" y="371" font-size="14" fill="#9bdab7" font-family="Menlo, Consolas, monospace">+ 44      issue_rotated_token(user_id,</text><rect x="281" y="382" width="647" height="29" rx="0" fill="#1c3633"/><text x="289" y="403" font-size="14" fill="#9bdab7" font-family="Menlo, Consolas, monospace">+ 45          token.family_id)</text><text x="289" y="435" font-size="14" fill="#8e9aaf" font-family="Menlo, Consolas, monospace">  46  }</text><rect x="289" y="500" width="631" height="114" rx="5" fill="#24324a"/><text x="305" y="528" font-size="11" fill="#8bb9ff" font-weight="700">INLINE FEEDBACK / lines 43–45</text><text x="305" y="558" font-size="14" fill="#dce3ee">Ensure revocation and issuance are atomic.</text><text x="305" y="590" font-size="12" fill="#8bb9ff">[Send to Claude Code]  [Attach failing test]</text><text x="289" y="650" font-size="12" fill="#8e9aaf">Example diff · +86 / -12 · 4 files</text><rect x="961" y="129" width="297" height="554" rx="6" fill="#1a212d"/><text x="979" y="158" font-size="12" fill="#efc084" font-weight="700">APPROVAL</text><text x="979" y="191" font-size="17" fill="#dce3ee" font-weight="700">Human review required</text><text x="979" y="225" font-size="13" fill="#8e9aaf">Review exact candidate SHA.</text><rect x="979" y="250" width="260" height="34" rx="6" fill="#8bb9ff"/><text x="991" y="272" font-size="13" fill="#171323" font-weight="700">Approve candidate</text><rect x="979" y="295" width="260" height="34" rx="6" fill="#222a38"/><text x="991" y="317" font-size="13" fill="#dce3ee" font-weight="700">Reject</text><rect x="979" y="340" width="260" height="34" rx="6" fill="#222a38"/><text x="991" y="362" font-size="13" fill="#dce3ee" font-weight="700">Request revision</text><rect x="979" y="393" width="260" height="1" rx="0" fill="#2b3341"/><text x="979" y="426" font-size="11" fill="#8e9aaf" font-weight="700">TARGETED CONTROLS</text><text x="979" y="459" font-size="14" fill="#dce3ee">Claude Code · selected</text><rect x="979" y="479" width="124" height="34" rx="6" fill="#222a38"/><text x="991" y="501" font-size="13" fill="#dce3ee" font-weight="700">Pause</text><rect x="1115" y="479" width="124" height="34" rx="6" fill="#222a38"/><text x="1127" y="501" font-size="13" fill="#dce3ee" font-weight="700">Resume</text><text x="979" y="554" font-size="12" fill="#8e9aaf">No ref update before approval.</text><text x="979" y="581" font-size="12" fill="#8e9aaf">Candidate changes reset approval.</text><rect x="22" y="706" width="1236" height="101" rx="6" fill="#1a2638" stroke="#3c5472"/><text x="40" y="735" font-size="12" fill="#8bb9ff" font-weight="700">REVISION INSTRUCTION → Claude Code</text><text x="40" y="769" font-size="15" fill="#dce3ee">Add an atomicity regression test, then rerun the auth suite. ▌</text><rect x="1024" y="746" width="211" height="34" rx="6" fill="#8bb9ff"/><text x="1036" y="768" font-size="13" fill="#171323" font-weight="700">Send revision request</text><rect x="20" y="828" width="1240" height="1" rx="0" fill="#2b3341"/><text x="24" y="849" font-size="12" fill="#8e9aaf">DESIGN MOCKUP · All tasks, activity, and test results are illustrative. Controls are not implemented.</text></g></svg>